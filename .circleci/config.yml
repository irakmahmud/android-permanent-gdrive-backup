version: 2.1

# ==============================================================================
# CircleCI Remote Cloud Build Pipeline for Android Permanent Google Drive Backup
# Reference:
# - https://circleci.com/docs/guides/execute/android-machine-image/
# - https://circleci.com/docs/guides/optimize/artifacts/
# Zero local SDK/Gradle/JDK required on the user's phone or local workspace.
# ==============================================================================

executors:
  android-machine:
    machine:
      image: android:2024.11.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3072m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  build-test-and-package-apk:
    executor: android-machine
    steps:
      # 1. GitHub Repository Checkout
      - checkout

      # 2 & 3. Remote JDK & Android SDK Environment Verification
      - run:
          name: "Step 2 & 3: Verify Remote CircleCI Android Machine Image, JDK 17 & Android SDK"
          command: |
            echo "=== CircleCI Remote Build Environment ==="
            uname -a
            java -version
            echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            which sdkmanager || true
            ls -la "${ANDROID_HOME:-/opt/android/sdk}/platforms" || true

      # 4. Gradle Wrapper Execution & Permission Check
      - run:
          name: "Step 4: Prepare & Verify Gradle Wrapper"
          command: |
            chmod +x ./gradlew
            ./gradlew --version

      # Restore Gradle Cache on Remote CircleCI Runner
      - restore_cache:
          keys:
            - v1-gradle-caches-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - v1-gradle-caches-

      # 5. Dependency Resolution
      - run:
          name: "Step 5: Resolve Android & Kotlin Dependencies"
          command: |
            ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon

      # 6. Kotlin Compilation
      - run:
          name: "Step 6: Compile Kotlin Sources & Unit Test Sources"
          command: |
            ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon

      # 7. Android Lint Verification
      - run:
          name: "Step 7: Run Android Lint Static Analysis"
          command: |
            ./gradlew :app:lintDebug --no-daemon

      # 8. Automated Security, Never-Delete & Reliability Unit Tests (All 13 Scenarios)
      - run:
          name: "Step 8: Execute Automated JUnit Reliability & Security Tests"
          command: |
            ./gradlew :app:testDebugUnitTest --info --no-daemon

      # 9. APK Assembly (Installable Debug APK + Conditional Signed Release APK)
      - run:
          name: "Step 9: Assemble Installable Debug APK & Optional Signed Release APK"
          command: |
            ./gradlew :app:assembleDebug --no-daemon
            if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
              echo "Decoding Release Keystore from CircleCI Secret Environment Variable..."
              echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
              export KEYSTORE_FILE_PATH=/tmp/release.keystore
              ./gradlew :app:assembleRelease --no-daemon
              rm -f /tmp/release.keystore
            else
              echo "KEYSTORE_BASE64 not configured in CircleCI Context; skipping Signed Release APK and providing Installable Debug APK."
            fi

      # 10. APK Integrity & Signature Check
      - run:
          name: "Step 10: Verify APK Zip Structure, Signature & SHA-256 Checksum"
          command: |
            mkdir -p /tmp/circleci-artifacts/apk /tmp/circleci-artifacts/reports
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK_PATH"
            unzip -t "$APK_PATH" > /tmp/circleci-artifacts/reports/apk-zip-integrity.txt
            sha256sum "$APK_PATH" | tee /tmp/circleci-artifacts/apk/app-debug.apk.sha256
            cp "$APK_PATH" /tmp/circleci-artifacts/apk/app-debug.apk
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              sha256sum "app/build/outputs/apk/release/app-release.apk" | tee /tmp/circleci-artifacts/apk/app-release.apk.sha256
              cp "app/build/outputs/apk/release/app-release.apk" /tmp/circleci-artifacts/apk/app-release.apk
            fi

      # Save Remote Gradle Cache
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v1-gradle-caches-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

      # 11 & 12. Build Result Reporting & Artifact Upload
      - run:
          name: "Step 12: Generate Build & Test Result Report"
          when: always
          command: |
            cat <<EOF > /tmp/circleci-artifacts/reports/build-summary.txt
            Project: Android Permanent Google Drive Backup App
            Commit: ${CIRCLE_SHA1:-HEAD}
            Branch: ${CIRCLE_BRANCH:-main}
            Build Number: ${CIRCLE_BUILD_NUM:-local}
            Policy: STRICT UPLOAD-ONLY / APPEND-ONLY / NEVER DELETE
            Root Drive Folder: Android_Permanent_Backup
            Default OAuth Scope: https://www.googleapis.com/auth/drive.file
            APK Output: app-debug.apk
            EOF
            cat /tmp/circleci-artifacts/reports/build-summary.txt

      - store_test_results:
          path: app/build/test-results/testDebugUnitTest

      - store_artifacts:
          path: /tmp/circleci-artifacts/apk
          destination: apk

      - store_artifacts:
          path: app/build/reports/tests/testDebugUnitTest
          destination: test-reports

      - store_artifacts:
          path: app/build/reports/lint-results-debug.html
          destination: lint-reports/lint-results-debug.html

      - store_artifacts:
          path: /tmp/circleci-artifacts/reports
          destination: build-reports

workflows:
  version: 2
  android-permanent-backup-pipeline:
    jobs:
      - build-test-and-package-apk
