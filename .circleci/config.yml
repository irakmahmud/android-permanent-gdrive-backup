version: 2.1

# ==============================================================================
# CircleCI Remote Cloud Build Pipeline for Permanent Drive v2.0.0
# (Android Google Drive Desktop Alternative — Strictly Upload-Only / Never-Delete)
# Zero local SDK/Gradle/JDK required on the user's phone or local workspace.
# ==============================================================================

executors:
  android-machine:
    machine:
      image: android:2024.11.1
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3072m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  build-test-and-package-apk:
    executor: android-machine
    steps:
      # 1. GitHub Repository Checkout
      - checkout

      # 2 & 3. Remote JDK 17 & Android SDK Environment Verification
      - run:
          name: "Stage 2 & 3: Verify Remote CircleCI Android Machine Image, JDK 17 & Android SDK"
          command: |
            echo "=== CircleCI Remote Build Environment ==="
            uname -a
            java -version
            echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            which sdkmanager || true
            ls -la "${ANDROID_HOME:-/opt/android/sdk}/platforms" || true

      # 4. Gradle Wrapper Permission & Verification
      - run:
          name: "Stage 4: Prepare & Verify Gradle Wrapper"
          command: |
            chmod +x ./gradlew
            ./gradlew --version

      # Restore Gradle Cache on Remote CircleCI Runner
      - restore_cache:
          keys:
            - v2-gradle-caches-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - v2-gradle-caches-

      # 5. Dependency Resolution
      - run:
          name: "Stage 5: Resolve Android, Compose, Room & Google Identity Dependencies"
          command: |
            ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon

      # 6. Kotlin Compilation
      - run:
          name: "Stage 6: Compile Kotlin Sources & Unit/Integration Test Sources"
          command: |
            ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon

      # 7. Static Analysis & Lint Check
      - run:
          name: "Stage 7: Run Android Lint Static Analysis"
          command: |
            ./gradlew :app:lintDebug --no-daemon

      # 8, 9 & 10. Unit Tests, Integration Tests & Never-Delete Policy Verification Tests (All 19 Automated Tests)
      - run:
          name: "Stage 8, 9 & 10: Execute 19 Unit, Integration & 3-Layer Never-Delete Policy Tests"
          command: |
            ./gradlew :app:testDebugUnitTest --info --no-daemon

      # 11. APK Assembly & Bytecode Secret Security Audit
      - run:
          name: "Stage 11: Assemble Debug/Release APK & Verify Zero Embedded Secrets"
          command: |
            ./gradlew :app:assembleDebug --no-daemon
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK_PATH"
            echo "=== Running APK Embedded Secret Audit ==="
            mkdir -p /tmp/apk-inspect
            unzip -q -o "$APK_PATH" -d /tmp/apk-inspect
            if strings /tmp/apk-inspect/classes*.dex | grep -E "DEFAULT_GDRIVE_REFRESH_TOKEN|GOOGLE_OAUTH_CLIENT_SECRET|GOCSPX-|1//0[a-zA-Z0-9_-]{20,}"; then
              echo "FATAL SECURITY VIOLATION: Hardcoded OAuth secret or refresh token detected in DEX bytecode!"
              exit 1
            fi
            echo "PASS: Zero embedded OAuth client secrets or refresh tokens found in APK DEX bytecode."
            rm -rf /tmp/apk-inspect

            if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
              echo "Decoding Release Keystore from CircleCI Secret Environment Variable..."
              echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
              export KEYSTORE_FILE_PATH=/tmp/release.keystore
              ./gradlew :app:assembleRelease --no-daemon
              rm -f /tmp/release.keystore
            else
              echo "KEYSTORE_BASE64 not configured in CircleCI Context; providing Installable Debug APK."
            fi

      # 12 & 13. APK Signature, Zip Verification & SHA-256 Checksum Generation
      - run:
          name: "Stage 12 & 13: Verify APK Zip Structure, Signing Certificate Fingerprints & SHA-256 Checksum"
          command: |
            mkdir -p /tmp/circleci-artifacts/apk /tmp/circleci-artifacts/reports
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            test -f "$APK_PATH"
            unzip -t "$APK_PATH" > /tmp/circleci-artifacts/reports/apk-zip-integrity.txt
            keytool -printcert -jarfile "$APK_PATH" | tee /tmp/circleci-artifacts/reports/apk-signing-certificate.txt
            sha256sum "$APK_PATH" | tee /tmp/circleci-artifacts/apk/app-debug.apk.sha256
            cp "$APK_PATH" /tmp/circleci-artifacts/apk/app-debug.apk
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              sha256sum "app/build/outputs/apk/release/app-release.apk" | tee /tmp/circleci-artifacts/apk/app-release.apk.sha256
              cp "app/build/outputs/apk/release/app-release.apk" /tmp/circleci-artifacts/apk/app-release.apk
            fi

      # Save Remote Gradle Cache
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v2-gradle-caches-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

      # 14. Build Result Reporting & Artifact Upload
      - run:
          name: "Stage 14: Generate Build, Security & Test Result Report"
          when: always
          command: |
            cat <<EOF > /tmp/circleci-artifacts/reports/build-summary.txt
            Project: Permanent Drive v2.0.0 — Android Google Drive Desktop Alternative
            Package: com.permanentbackup.gdrive
            Version: 2.0.0 (versionCode 5)
            Commit: ${CIRCLE_SHA1:-HEAD}
            Branch: ${CIRCLE_BRANCH:-main}
            Build Number: ${CIRCLE_BUILD_NUM:-local}
            Policy: 3-LAYER IMMUTABLE NEVER-DELETE POLICY (UPLOAD-ONLY / APPEND-ONLY)
            Auth Architecture: Google Identity Services AuthorizationClient + GoogleAuthUtil (Zero Embedded Secrets)
            Root Drive Folder: Android_Permanent_Backup
            Default OAuth Scope: https://www.googleapis.com/auth/drive.file
            APK Output: app-debug.apk
            EOF
            cat /tmp/circleci-artifacts/reports/build-summary.txt

      - store_test_results:
          path: app/build/test-results/testDebugUnitTest

      - store_artifacts:
          path: /tmp/circleci-artifacts/apk
          destination: apk

      - store_artifacts:
          path: app/build/reports/tests/testDebugUnitTest
          destination: test-reports

      - store_artifacts:
          path: app/build/reports/lint-results-debug.html
          destination: lint-reports/lint-results-debug.html

      - store_artifacts:
          path: /tmp/circleci-artifacts/reports
          destination: build-reports

workflows:
  version: 2
  android-permanent-backup-pipeline:
    jobs:
      - build-test-and-package-apk
