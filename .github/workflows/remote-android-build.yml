name: Remote Cloud Android Build & Verification (Permanent Drive v2.3.1)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remote-android-apk-build:
    name: Remote Cloud Build, Lint, 37 Unit/Integration Tests, Secret Scan & v2.3.1 Release
    runs-on: ubuntu-latest
    env:
      CLOUD_BRIDGE_PAYLOAD: ${{ secrets.CLOUD_BRIDGE_PAYLOAD }}
    steps:
      - name: "Stage 1: GitHub Repository Checkout"
        uses: actions/checkout@v4

      - name: "Stage 2 & 3: Set up Remote JDK 17 & Verify Android SDK"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Stage 4: Gradle Wrapper Permission & Verification"
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: "Stage 5: Dependency Resolution"
        run: |
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon

      - name: "Stage 6: Kotlin Compilation (App & Test Sources)"
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon

      - name: "Stage 7: Static Analysis & Android Lint"
        run: |
          ./gradlew :app:lintDebug --no-daemon

      - name: "Stage 8, 9 & 10: Execute 37 Unit, Integration & 3-Layer Never-Delete Policy Tests"
        run: |
          ./gradlew :app:testDebugUnitTest --info --no-daemon

      - name: "Stage 11: Assemble Installable APK & Run DEX Bytecode Secret Audit"
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          echo "=== Auditing APK DEX Bytecode for Forbidden Secrets/Tokens ==="
          mkdir -p /tmp/apk-inspect
          unzip -q -o "$APK_FILE" -d /tmp/apk-inspect
          if strings /tmp/apk-inspect/classes*.dex | grep -E "DEFAULT_GDRIVE_REFRESH_TOKEN|GOOGLE_OAUTH_CLIENT_SECRET|GOCSPX-|1//0[a-zA-Z0-9_-]{20,}"; then
            echo "FATAL SECURITY VIOLATION: Hardcoded OAuth secret or refresh token found in APK DEX bytecode!"
            exit 1
          fi
          echo "SECURITY AUDIT PASSED: Zero embedded refresh tokens, client secrets, or personal credentials in APK bytecode."
          rm -rf /tmp/apk-inspect

      - name: "Stage 12 & 13: Verify APK Zip Structure, Extract Signing SHA-1/SHA-256 & Compute APK Checksum"
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          unzip -t "$APK_FILE" | tail -n 5
          echo "=== APK Signing Certificate Fingerprints (Register SHA-1 in Google Cloud Console) ==="
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_FILE" | tee app/build/outputs/apk/debug/apk-signing-certificate.txt
          sha256sum "$APK_FILE" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK_FILE"

      - name: "Stage 14a: Upload Downloadable APK & Reports Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Permanent-Drive-v2.3.1-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      - name: "Stage 14b: Publish Direct Downloadable APK to GitHub Releases (v2.3.1)"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.1
          name: "Permanent Drive v2.3.1 — Startup Crash Fixes & Desktop Parity (Zero-Deletion)"
          body: |
            Automated Remote Cloud Build of **Permanent Drive v2.3.1** (`com.permanentbackup.gdrive`, `versionCode = 9`).
            - **v2.3.1 Crash Fixes**:
              1. Fixed uncaught `AuthTokenExpiredException` / `IOException` on startup in `GoogleAuthManager.authorizeSelectedNativeAccount()` and `BackupRepository.syncPersistedAccountOnStartup()`.
              2. Fixed Room 2.6.1 `IllegalStateException: Migration didn't properly handle: backup_file_records` by rebuilding `backup_file_records` and `app_settings` without SQLite `DEFAULT` column metadata mismatch (`MIGRATION_2_3` & `MIGRATION_3_4`, `version = 4`), preserving 100% of existing rows.
              3. Moved all `BackupViewModel.refreshDashboardAndCoverage()` database and storage scans off the Main UI thread onto `Dispatchers.IO` with `CoroutineExceptionHandler` and eliminated redundant recursive `walkTopDown()` directory scans.
              4. Converted `PermanentBackupApp.database` and `PermanentBackupApp.repository` from `lateinit var` to thread-safe `by lazy(LazyThreadSafetyMode.SYNCHRONIZED)` so early `ContentProvider` queries never throw `UninitializedPropertyAccessException`.
              5. Hardened `EncryptedSharedPreferences` Keystore recovery, `WorkManager` scheduling, `ForegroundService` launch, and Compose progress clamping.
            - **3 Core Rules Strictly Enforced**: Zero Deletion, Immutable Version Preservation, Strict Separation of Backup vs Cloud-to-Local Mirroring.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt
