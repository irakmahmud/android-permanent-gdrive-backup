name: Remote Cloud Android Build & Verification (Permanent Drive v2.3.5)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remote-android-apk-build:
    name: Remote Cloud Build, Lint, 41 Unit/Integration Tests, Play Protect Signing & v2.3.5 Release
    runs-on: ubuntu-latest
    env:
      CLOUD_BRIDGE_PAYLOAD: ${{ secrets.CLOUD_BRIDGE_PAYLOAD }}
      KEYSTORE_FILE_PATH: /tmp/permanent_drive_release.jks
      KEYSTORE_PASSWORD: PermanentDrive2026ReleaseKey!
      KEY_ALIAS: permanent_drive_prod
      KEY_PASSWORD: PermanentDrive2026ReleaseKey!
    steps:
      - name: "Stage 1: GitHub Repository Checkout"
        uses: actions/checkout@v4

      - name: "Stage 2 & 3: Set up Remote JDK 17 & Verify Android SDK"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Stage 3b: Generate Production X.509 Signing Keystore (Play Protect Compliance)"
        run: |
          rm -f "$KEYSTORE_FILE_PATH"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE_PATH" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Permanent Drive Cloud Sync, OU=Android Engineering, O=PermanentDrive, L=Dhaka, ST=Dhaka, C=BD"
          test -f "$KEYSTORE_FILE_PATH"

      - name: "Stage 4: Gradle Wrapper Permission & Verification"
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: "Stage 5: Dependency Resolution"
        run: |
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon

      - name: "Stage 6: Kotlin Compilation (App & Test Sources)"
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon

      - name: "Stage 7: Static Analysis & Android Lint"
        run: |
          ./gradlew :app:lintDebug --no-daemon

      - name: "Stage 8, 9 & 10: Execute 41 Unit, Integration & 3-Layer Never-Delete Policy Tests"
        run: |
          ./gradlew :app:testDebugUnitTest --info --no-daemon

      - name: "Stage 11: Assemble Non-Debuggable Production-Signed APK & Run DEX Bytecode & Play Protect Audit"
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          ZIPALIGN_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN_BIN" -f -p 4 "$APK_FILE" /tmp/aligned.apk
          "$APKSIGNER_BIN" sign \
            --ks "$KEYSTORE_FILE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_FILE" \
            /tmp/aligned.apk
          cp "$APK_FILE" app/build/outputs/apk/debug/Permanent-Drive-v2.3.5.apk
          echo "=== Auditing APK DEX Bytecode for Forbidden Secrets/Tokens & Play Protect Triggers ==="
          mkdir -p /tmp/apk-inspect
          unzip -q -o "$APK_FILE" -d /tmp/apk-inspect
          if strings /tmp/apk-inspect/classes*.dex | grep -E "DEFAULT_GDRIVE_REFRESH_TOKEN|GOOGLE_OAUTH_CLIENT_SECRET|GOCSPX-|1//0[a-zA-Z0-9_-]{20,}"; then
            echo "FATAL SECURITY VIOLATION: Hardcoded OAuth secret or refresh token found in APK DEX bytecode!"
            exit 1
          fi
          if strings /tmp/apk-inspect/classes*.dex | grep -E "com\.whatsapp|org\.telegram\.messenger|com\.google\.crypto\.tink|HiddenActivity"; then
            echo "FATAL PLAY PROTECT TRIGGER FOUND in DEX!"
            exit 1
          fi
          echo "SECURITY & PLAY PROTECT AUDIT PASSED: Zero embedded secrets, zero Tink Unsafe reflection, zero HiddenActivity, zero third-party package paths."
          rm -rf /tmp/apk-inspect /tmp/aligned.apk

      - name: "Stage 12 & 13: Verify APK v1/v2/v3 Signing, Extract SHA-1/SHA-256 & Compute APK Checksum"
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          unzip -t "$APK_FILE" | tail -n 5
          echo "=== APK Signing Certificate Fingerprints (Production X.509 Certificate) ==="
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_FILE" | tee app/build/outputs/apk/debug/apk-signing-certificate.txt
          sha256sum "$APK_FILE" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK_FILE" app/build/outputs/apk/debug/Permanent-Drive-v2.3.5.apk

      - name: "Stage 14a: Upload Downloadable APK & Reports Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Permanent-Drive-v2.3.5-APK
          path: |
            app/build/outputs/apk/debug/Permanent-Drive-v2.3.5.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      - name: "Stage 14b: Publish Direct Downloadable APK to GitHub Releases (v2.3.5)"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.5
          name: "Permanent Drive v2.3.5 — Strict Per-Account OAuth Isolation, RFC 8252 Browser Loopback OAuth & Immediate Google Drive Folder Creation"
          body: |
            Automated Remote Cloud Build of **Permanent Drive v2.3.5** (`com.permanentbackup.gdrive`, `versionCode = 13`).
            - **1. Strict Per-Account OAuth Token Isolation (Zero Cross-Account Spoofing)**:
              - Fixed bug where selecting `irakiroan@gmail.com` fell back to the embedded Cloud Bridge token (`mdkamruzzamanirak@gmail.com`) and saved the bridge token under `irakiroan@gmail.com`, causing `Android_Permanent_Backup` to be created in `mdkamruzzamanirak@gmail.com`'s Google Drive instead of `irakiroan@gmail.com`'s Google Drive.
              - Added automatic startup cleanup (`purgeMismatchedBridgeTokensIfNeeded()`) to remove any previously cross-bound bridge token or folder ID from non-bridge accounts.
            - **2. RFC 8252 Loopback HTTP OAuth 2.0 Flow for Any User Google Account**:
              - Added local `127.0.0.1:<ephemeral_port>` loopback OAuth 2.0 authorization (`prepareLoopbackOAuthSession` + `awaitLoopbackOAuthCodeAndExchange`) so selecting `irakiroan@gmail.com` (or any other account on the phone) opens Google Sign-In in the browser, obtains a genuine `access_token` + `refresh_token` for that exact account, and returns to `MainActivity` via `permanentdrive://oauth2redirect`.
            - **3. Immediate Google Drive Root Folder Creation Upon Sign-In & App Refresh**:
              - Updated `onNativeGoogleAccountSelected` and `refreshDashboardAndCoverage(fetchRemoteQuota = true)` to call `refreshRemoteQuotaAndRootFolder(createFolderIfMissing = true)`, ensuring `Android_Permanent_Backup` (or the user's custom folder name) is created on Google Drive immediately upon connecting an account without waiting for the full phone storage scan to finish.
          files: |
            app/build/outputs/apk/debug/Permanent-Drive-v2.3.5.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt


