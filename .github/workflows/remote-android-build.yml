name: Remote Cloud Android Build & Verification (Permanent Drive v2.2.0)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remote-android-apk-build:
    name: Remote Cloud Build, Lint, 28 Unit/Integration Tests, Secret Scan & v2.2.0 Release
    runs-on: ubuntu-latest
    env:
      CLOUD_BRIDGE_PAYLOAD: ${{ secrets.CLOUD_BRIDGE_PAYLOAD }}
    steps:
      - name: "Stage 1: GitHub Repository Checkout"
        uses: actions/checkout@v4

      - name: "Stage 2 & 3: Set up Remote JDK 17 & Verify Android SDK"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Stage 4: Gradle Wrapper Permission & Verification"
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: "Stage 5: Dependency Resolution"
        run: |
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon

      - name: "Stage 6: Kotlin Compilation (App & Test Sources)"
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon

      - name: "Stage 7: Static Analysis & Android Lint"
        run: |
          ./gradlew :app:lintDebug --no-daemon

      - name: "Stage 8, 9 & 10: Execute 28 Unit, Integration & 3-Layer Never-Delete Policy Tests"
        run: |
          ./gradlew :app:testDebugUnitTest --info --no-daemon

      - name: "Stage 11: Assemble Installable APK & Run DEX Bytecode Secret Audit"
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          echo "=== Auditing APK DEX Bytecode for Forbidden Secrets/Tokens ==="
          mkdir -p /tmp/apk-inspect
          unzip -q -o "$APK_FILE" -d /tmp/apk-inspect
          if strings /tmp/apk-inspect/classes*.dex | grep -E "DEFAULT_GDRIVE_REFRESH_TOKEN|GOOGLE_OAUTH_CLIENT_SECRET|GOCSPX-|1//0[a-zA-Z0-9_-]{20,}"; then
            echo "FATAL SECURITY VIOLATION: Hardcoded OAuth secret or refresh token found in APK DEX bytecode!"
            exit 1
          fi
          echo "SECURITY AUDIT PASSED: Zero embedded refresh tokens, client secrets, or personal credentials in APK bytecode."
          rm -rf /tmp/apk-inspect

      - name: "Stage 12 & 13: Verify APK Zip Structure, Extract Signing SHA-1/SHA-256 & Compute APK Checksum"
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          unzip -t "$APK_FILE" | tail -n 5
          echo "=== APK Signing Certificate Fingerprints (Register SHA-1 in Google Cloud Console) ==="
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_FILE" | tee app/build/outputs/apk/debug/apk-signing-certificate.txt
          sha256sum "$APK_FILE" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK_FILE"

      - name: "Stage 14a: Upload Downloadable APK & Reports Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Permanent-Drive-v2.2.0-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      - name: "Stage 14b: Publish Direct Downloadable APK to GitHub Releases (v2.2.0)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "Permanent Drive v2.2.0 — Complete 11-Feature Google Drive Desktop Parity with 3-Rule Zero-Deletion Safety"
          body: |
            Automated Remote Cloud Build of **Permanent Drive v2.2.0** (`com.permanentbackup.gdrive`, `versionCode = 7`).
            - **11 Desktop Parity Features Implemented**:
              1. Read-Only SAF `DocumentsProvider` (`PermanentDriveDocumentsProvider`) & Seekable Local Descriptor in `DriveStreamingContentProvider` + Open File in External App.
              2. Real-Time File Watcher (`LocalStorageFileObserverManager` + WorkManager `ContentUriTrigger`) & Fast Metadata-First Incremental Scan (`computeHashes = false` when size + mtime match).
              3. Custom SAF Folder Persistence (`registerPersistedSafFolder`), Per-Folder Auto-Backup Toggle in Local Explorer, & Removable SD Card Root Switching.
              4. Automatic Background Incremental Cloud Changes Sync (`syncCloudChangesIncremental`), Auto-Refresh of Modified Pinned Offline Files, & One-Way Cloud-to-Local Folder Mirror (`Drive_Mirror`) Strictly Isolated from Backup.
              5. System-Wide `"Save to Permanent Drive"` Share Sheet Receiver (`ACTION_SEND` / `ACTION_SEND_MULTIPLE`), Direct File Upload (`+ Upload`), & Cloud Folder Creation (`+ Folder`).
              6. Rich Live Progress Notification (`PermanentBackupForegroundService`) with Active File, %, Speed, ETA, and `Pause`/`Resume`/`Stop` Actions + Fixed Duplicate Manual Backup Trigger.
              7. Parallel Upload Worker Pool (`Semaphore(uploadConcurrency)`) + Optional Bandwidth Rate-Limiting (`maxUploadSpeedKbps`) + Interactive Settings Controls.
              8. Google Workspace Docs/Sheets/Slides `/export` Support (PDF/DOCX/XLSX/PPTX) + `nextPageToken` Cloud Pagination (`Load More`) + Filter/Folder-Aware Offline Browsing.
              9. Multi-Account Per-Account Version Isolation (`accountId` in `backup_file_records` + Room Migration v2->v3).
              10. Recursive Folder Restore/Download & Recursive Folder Offline Pinning in `My Drive`.
              11. Live Transactional `SyncJobState` & Unresolved HTTP Error Diagnostics in Transfers Screen.
            - **3 Core Rules Strictly Enforced**: Zero Deletion, Immutable Version Preservation (`v1`, `v2`, ...), and Strict Separation of Backup vs Cloud-to-Local Mirroring (`Restored_From_Drive` / `Drive_Mirror` excluded from local scanner).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt
