name: Remote Cloud Android Build & Verification (Permanent Drive v2.3.6)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remote-android-apk-build:
    name: Remote Cloud Build, Lint, 42 Unit/Integration Tests, Play Protect Signing & v2.3.6 Release
    runs-on: ubuntu-latest
    env:
      CLOUD_BRIDGE_PAYLOAD: ${{ secrets.CLOUD_BRIDGE_PAYLOAD }}
      KEYSTORE_FILE_PATH: /tmp/permanent_drive_release.jks
      KEYSTORE_PASSWORD: PermanentDrive2026ReleaseKey!
      KEY_ALIAS: permanent_drive_prod
      KEY_PASSWORD: PermanentDrive2026ReleaseKey!
    steps:
      - name: "Stage 1: GitHub Repository Checkout"
        uses: actions/checkout@v4

      - name: "Stage 2 & 3: Set up Remote JDK 17 & Verify Android SDK"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Stage 3b: Generate Production X.509 Signing Keystore (Play Protect Compliance)"
        run: |
          rm -f "$KEYSTORE_FILE_PATH"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE_PATH" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Permanent Drive Cloud Sync, OU=Android Engineering, O=PermanentDrive, L=Dhaka, ST=Dhaka, C=BD"
          test -f "$KEYSTORE_FILE_PATH"

      - name: "Stage 4: Gradle Wrapper Permission & Verification"
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: "Stage 5: Dependency Resolution"
        run: |
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon

      - name: "Stage 6: Kotlin Compilation (App & Test Sources)"
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon

      - name: "Stage 7: Static Analysis & Android Lint"
        run: |
          ./gradlew :app:lintDebug --no-daemon

      - name: "Stage 8, 9 & 10: Execute 42 Unit, Integration & 3-Layer Never-Delete Policy Tests"
        run: |
          ./gradlew :app:testDebugUnitTest --info --no-daemon

      - name: "Stage 11: Assemble Non-Debuggable Production-Signed APK & Run DEX Bytecode & Play Protect Audit"
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          ZIPALIGN_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN_BIN" -f -p 4 "$APK_FILE" /tmp/aligned.apk
          "$APKSIGNER_BIN" sign \
            --ks "$KEYSTORE_FILE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_FILE" \
            /tmp/aligned.apk
          cp "$APK_FILE" app/build/outputs/apk/debug/Permanent-Drive-v2.3.6.apk
          echo "=== Auditing APK DEX Bytecode for Forbidden Secrets/Tokens & Play Protect Triggers ==="
          mkdir -p /tmp/apk-inspect
          unzip -q -o "$APK_FILE" -d /tmp/apk-inspect
          if strings /tmp/apk-inspect/classes*.dex | grep -E "DEFAULT_GDRIVE_REFRESH_TOKEN|GOOGLE_OAUTH_CLIENT_SECRET|GOCSPX-|1//0[a-zA-Z0-9_-]{20,}"; then
            echo "FATAL SECURITY VIOLATION: Hardcoded OAuth secret or refresh token found in APK DEX bytecode!"
            exit 1
          fi
          if strings /tmp/apk-inspect/classes*.dex | grep -E "com\.whatsapp|org\.telegram\.messenger|com\.google\.crypto\.tink|HiddenActivity"; then
            echo "FATAL PLAY PROTECT TRIGGER FOUND in DEX!"
            exit 1
          fi
          echo "SECURITY & PLAY PROTECT AUDIT PASSED: Zero embedded secrets, zero Tink Unsafe reflection, zero HiddenActivity, zero third-party package paths."
          rm -rf /tmp/apk-inspect /tmp/aligned.apk

      - name: "Stage 12 & 13: Verify APK v1/v2/v3 Signing, Extract SHA-1/SHA-256 & Compute APK Checksum"
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_FILE"
          unzip -t "$APK_FILE" | tail -n 5
          echo "=== APK Signing Certificate Fingerprints (Production X.509 Certificate) ==="
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_FILE" | tee app/build/outputs/apk/debug/apk-signing-certificate.txt
          sha256sum "$APK_FILE" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK_FILE" app/build/outputs/apk/debug/Permanent-Drive-v2.3.6.apk

      - name: "Stage 14a: Upload Downloadable APK & Reports Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Permanent-Drive-v2.3.6-APK
          path: |
            app/build/outputs/apk/debug/Permanent-Drive-v2.3.6.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      - name: "Stage 14b: Publish Direct Downloadable APK to GitHub Releases (v2.3.6)"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.6
          name: "Permanent Drive v2.3.6 — Complete Atomic Account Switch ('Account Switch Means Everything Switches') & Legacy Spoofed SQLite Remediation"
          body: |
            Automated Remote Cloud Build of **Permanent Drive v2.3.6** (`com.permanentbackup.gdrive`, `versionCode = 14`).
            - **1. Complete Atomic Account Switch ("Account Switch Means Everything Switches")**:
              - Switching accounts (`prepareForAccountSwitch` + `onAccountSwitchReset` + `resetStateForAccountSwitch`) immediately switches 100% of app state: OAuth tokens, root Drive folder ID & folder name, in-flight backup cycle cancellation, Drive storage quota, active upload progress, scan banner, My Drive explorer, folder coverage counts, and all Room SQLite streams (`ActiveQueue`, `VerifiedHistory`, `RecentRecords`, `FailedUploads`, `SyncJobs`, `SyncEvents`, `UnresolvedFailures`, `PinnedOfflineFiles`).
              - Scoped all remaining DAO queries (`getInProgressRecordsForAccount`, `getFailedRecordsForAccountPaged`, `getAllVersionsForAccountAndIdentity`, `getActiveIdentitiesForAccountPaged`, `markLocalFileDeletedForAccountPreservingCloudBackup`, `markVersionsPreservedForAccountAfterLocalDelete`, `sumOfflineCachedBytesForAccount`, `getCloudFilesByParentForAccount`, `countPreservedAfterLocalDeleteForAccount`) strictly to the active Google Account.
            - **2. Automatic Remediation of Legacy Spoofed SQLite Rows & Old Credentials (`remediateLegacyBridgeSpoofedDataIfNeeded`)**:
              - Eliminates the bug where `syncPersistedAccountOnStartup()` restored `mdkamruzzamanirak@gmail.com`'s root folder ID (`19pEu61NKlENus5JAEmUkST5EimE6KOm_`) from SQLite back onto `irakiroan@gmail.com`.
              - Non-destructively reassigns all `v2.3.4` spoofed SQLite records from `irakiroan@gmail.com` to `mdkamruzzamanirak@gmail.com` (zero data loss) and clears `irakiroan@gmail.com`'s spoofed folder cache so `irakiroan@gmail.com` immediately creates its own `Android_Permanent_Backup` folder and backs up all phone files into `irakiroan@gmail.com`'s Google Drive.
          files: |
            app/build/outputs/apk/debug/Permanent-Drive-v2.3.6.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/apk-signing-certificate.txt


